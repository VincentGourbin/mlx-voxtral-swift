# K-29 — build and unit tests without models on every push and pull request.
# Tests that need a downloaded model or a real-audio run skip themselves (XCTSkip / TEST_RUNNER_ guards).
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26          # Apple Silicon; swift-tools 6.2 needs Xcode 26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Placeholder for the untracked Core ML resource of VoxtralApp
        # VoxtralEncoderFull.mlmodelc (1.3 GB) is not in git; the app looks it up at run time only (K-28 removes it)
        run: mkdir -p Sources/VoxtralApp/Resources/VoxtralEncoderFull.mlmodelc

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test -scheme MLXVoxtralSwift-Package -destination 'platform=macOS' \
            -derivedDataPath .build/xcode-test -parallel-testing-enabled NO \
            -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -skipMacroValidation \
            | tee xcodebuild.log | grep -E "Test Suite|Executed|error:|BUILD|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
