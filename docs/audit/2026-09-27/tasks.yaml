# Tâches task-dispatch générées depuis docs/audit/2026-09-27/PLAN.md (fiches Cible = macos-gpu).
# Essai à blanc : python3 ~/.claude/skills/task-dispatch/scripts/dispatch.py docs/audit/2026-09-27/tasks.yaml
# Sans gh : … --emit-json --issue-map docs/audit/2026-09-27/map.json (voir skill task-dispatch §2 bis).
# Les fiches cloud (K-17…K-21, K-81) ne sont pas ici : elles sont exécutées dans la session cloud.
# Prérequis de toutes les tâches : les fichiers docs/audit/2026-09-27/ doivent être poussés sur la branche.
defaults:
  project: mlx-voxtral-swift
  severity: medium
  task:
    repo: VincentGourbin/mlx-voxtral-swift
    runs_on: [macos-gpu]
    requires: [mlx, xcode, gh, git]
    branch: claude/action-plan-skills-beta-wifgmu
tasks:
  - id: K-1
    subject: "[voxtral K-1] Convertir les erreurs MLX en VoxtralError aux points d'entrée publics (plus de fatalError dans l'app hôte)"
    severity: high
    task:
      goal: "Convertir les erreurs MLX en VoxtralError aux points d'entrée publics (plus de fatalError dans l'app hôte)"
      gate: "test `MLXErrorBoundaryTests` : invite synthétique de 2 600 positions préfillée avec `MemoryOptimizationConfig.ultra` (déclencheur P-03, présent tant que K-2 n'est pas livré) → `VoxtralError.mlx` levée, processus vivant (rouge sans correctif = plantage du runner de test, piège 38) ; suite complète verte ; durée totale de `VoxtralCLI transcribe` sur C-moyen EN inchangée à ±5 % (A/B/B/A, `/usr/bin/time`)."
      instructions: |
        Dépôt VincentGourbin/mlx-voxtral-swift, branche claude/action-plan-skills-beta-wifgmu :
          git fetch origin && git checkout claude/action-plan-skills-beta-wifgmu && git pull --ff-only
        Lire docs/audit/2026-09-27/fiches/K-1.md (cahier des charges complet : à lire, fichiers, étapes, validation, pièges),
        puis docs/audit/2026-09-27/PLAN.md §0 et §5 (règles de mesure, corpus, commandes) et les rapports cités par la fiche.
        Amendement du planificateur (2026-09-28, relecture de la fiche contre les scripts et le code) — prime sur la fiche :
          - Prérequis : claude-skills ≥ 0.6.0 sur le Mac (apply.py --pattern MLX-021 et machine-check.sh --procs n'existent
            pas avant) ; sinon report-task.py --status blocked.
          - Test (b) : construire un VoxtralForConditionalGeneration(standardModel:) réduit à poids aléatoires (graine fixée,
            au moins 2 couches) et appeler directement try model.generateStream(inputIds: <2 600 positions>, maxNewTokens: 1,
            memoryOptimization: .ultra), SANS withMLXErrors dans le test ; attendre VoxtralError.mlx (XCTAssertThrowsError puis
            guard case .mlx). Le correctif ouvre withMLXErrors dans le corps de generateStream (et des autres points d'entrée).
          - Si, correctif en place, le test (b) s'arrête sur un piège Swift (ex. « Index out of range » en lisant la forme d'un
            tableau vide rendu par l'opération fautive) au lieu de lever VoxtralError.mlx : vérifier la boîte d'erreur après
            chaque couche du décodeur (boucle interne throws, sans changer de signature publique), avant toute lecture de forme.
          - Étape 3 (rouge) : garder VoxtralError.mlx, MLXErrorBoundary.swift et le test ; ne retirer que l'enveloppement
            withMLXErrors et les `try error.check()` (sinon la cible de test ne compile pas ; git stash ne prend pas un fichier
            non suivi sans -u). Ligne RED attendue inchangée.
          - Étape 7 (A/B/B/A) : A = commit parent construit dans un worktree ; copier le Package.resolved de B à la racine de A ;
            construire A et B avec xcodebuild … -onlyUsePackageVersionsFromResolvedFile ; après les builds, noter pour chaque
            arbre `git -C <arbre>/.build/xcode/SourcePackages/checkouts/<p> rev-parse HEAD` pour mlx-swift, mlx-swift-lm et
            swift-mlx-profiler (identiques, recopiées dans l'entrée §7) ; une passe d'amorçage exclue avant A/B/B/A.
          - machine-check : --procs 'Voxtral.*|FluxForge.*' (FluxForge Studio, app MLX, n'est pas détectée sinon).
          - Ne committer que les fichiers nommés (pas de git add -A).
        Exécuter la fiche telle qu'écrite (skill task-runner) : un commit par fiche, porte recopiée telle quelle
        dans le rapport, entrée de journal dans docs/audit/2026-09-27/PLAN.md §7 et docs/knowledge/log.md.
        Porte : test `MLXErrorBoundaryTests` : invite synthétique de 2 600 positions préfillée avec `MemoryOptimizationConfig.ultra` (déclencheur P-03, présent tant que K-2 n'est pas livré) → `VoxtralError.mlx` levée, processus vivant (rouge sans correctif = plantage du runner de test, piège 38) ; suite complète verte ; durée totale de `VoxtralCLI transcribe` sur C-moyen EN inchangée à ±5 % (A/B/B/A, `/usr/bin/time`).
      deliverables: ["commit(s) sur la branche", "porte observée recopiée dans le rapport", "entrée de journal PLAN.md §7"]
