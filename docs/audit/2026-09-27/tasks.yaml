            maxTokens 4 096, préfixe EN « Flux Forge Studio turns your Mac into a complete » stable, pic consigné.
          - ASK-7 = A : contexte complet ; le profil lean borne la durée d'audio acceptée (erreur typée au-delà) ; le seuil
